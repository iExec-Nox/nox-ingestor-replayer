[package]
name = "nox-ingestor-replayer"
version = "0.0.0"
edition = "2024"
license = "BUSL-1.1"

[dependencies]
alloy = "2.0.5"
anyhow = "1.0.102"
async-nats = "0.48.0"
axum = "0.8.9"
axum-prometheus = "0.10.0"
chrono = { version = "0.4.44", features = ["serde"] }
config = "0.15.22"
config-secret = "0.1.0"
humantime-serde = "1.1.1"
serde = "1.0.228"
serde_json = "1.0.149"
thiserror = "2.0.18"
tokio = { version = "1.52.3", features = ["signal"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

[dev-dependencies]
tokio = { version = "1.52.3", features = ["macros", "rt-multi-thread", "sync", "time", "test-util"] }
